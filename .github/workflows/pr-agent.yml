# AI review via the shared workflow in interplay-adversarial/.github (secret MAAS_API_KEY)
name: PR Agent
on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  pr_agent:
    # Same-repo, non-bot PRs; slash commands only from owner/members/collaborators.
    if: >-
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && !github.event.pull_request.draft) ||
        (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && startsWith(github.event.comment.body, '/')
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      )
    permissions:
      issues: write
      pull-requests: write
      contents: read
    # TEMP (2026-10-23): pinned past Dependabot's SHA to pick up the shared workflow's
    # temporary gemma4 default (qwen38-27b backend down on TMM MaaS) without writing the
    # MaaS hostname into this repo's own file (audit_publication.py's url-host-not-public-
    # reference check would flag it). Revert the pin once qwen38-27b recovers.
    uses: interplay-adversarial/.github/.github/workflows/pr-agent.yml@0eb03f96402c6b7497bce1ba4cc7fb4be2fbde2c
    secrets:
      MAAS_API_KEY: ${{ secrets.MAAS_API_KEY }}
