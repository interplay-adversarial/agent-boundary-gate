repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: Ruff lint
        entry: uv run --frozen --no-editable ruff check src tests scripts examples
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format check
        entry: uv run --frozen --no-editable ruff format --check src tests scripts examples
        language: system
        pass_filenames: false
        always_run: true
      - id: unit-tests
        name: Unit and loopback integration tests
        entry: uv run --frozen --no-editable python -m unittest discover -s tests -q
        language: system
        pass_filenames: false
        always_run: true
      - id: rust-probe-checks
        name: Rust probe format, Clippy, tests and artifact privacy
        entry: uv run --frozen --no-editable python -m scripts.rust_probe_build --check
        language: system
        pass_filenames: false
        always_run: true
      - id: rust-probe-cve-audit
        name: Rust probe locked dependency CVE audit
        entry: uv run --frozen --no-editable python -m scripts.audit_rust_probe
        language: system
        pass_filenames: false
        always_run: true
      - id: dependency-cve-audit
        name: Locked dependency CVE audit
        entry: uv run --frozen --no-editable python scripts/audit_dependencies.py
        language: system
        pass_filenames: false
        always_run: true
      - id: gym-dependency-cve-audit
        name: Separate Gym onboarding locked dependency CVE audit
        entry: uv run --frozen --no-editable python scripts/audit_dependencies.py --gym
        language: system
        pass_filenames: false
        always_run: true
      - id: publication-privacy
        name: Publication privacy audit
        entry: uv run --frozen --no-editable python scripts/audit_publication.py
        language: system
        pass_filenames: false
        always_run: true
      - id: gym-native-smoke-tests
        name: Pinned Gym native model-smoke conformance (no model traffic)
        entry: uv run --project onboarding/gym --frozen --no-editable python -m unittest discover -s tests -p test_gym_smoke_native.py -q
        language: system
        pass_filenames: false
        always_run: true
