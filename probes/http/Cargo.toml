[package]
name = "gate-http-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
description = "Experimental fixed IP-literal HTTP action for independent boundary evaluation"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
