[project]
name = "agent-boundary-gate-gym-native-effects"
version = "0.1.0"
requires-python = "==3.14.7"
dependencies = [
  # Separate third environment: the supervised native Gym worker imports both the pinned
  # SimpleAgent and Interplay's native target adapter. Do not merge it into onboarding/gym
  # (offline replay/OpenShell) or onboarding/red-team (DataDesigner campaigns).
  "interplay-adversarial @ git+https://github.com/interplay-adversarial/interplay.git@ba848bc3fc1dc7fff47861a798c87deb338c37e0",
  "nemo-gym @ git+https://github.com/NVIDIA-NeMo/Gym.git@b454c9a6e9a5644564fac81064050094b237daaa",
  "pyarrow==24.0.0",
]

[tool.uv]
package = false
# Same explicit CVE remediations as onboarding/gym; a development baseline, not upstream's lock.
constraint-dependencies = [
  "datasets==5.0.1",
  "filelock==4.2.4",
  "fsspec==2026.6.0",
  "hydra-core==1.3.7",
  "idna==3.15",
  "python-dotenv==1.2.2",
  "requests==2.33.0",
  "virtualenv==21.7.13",
]
# data-designer==0.9.7 itself hard-pins opentelemetry-api<1.44,>=1.43 (CVE-2026-114603,
# fixed in 1.45.1, is not resolvable within that range) -- a constraint can only narrow,
# not widen past this, so override-dependencies is needed instead (same reasoning as
# onboarding/red-team). data-designer only uses the stable, additive metrics/trace API
# surface, verified empirically by the full test suite below.
override-dependencies = [
  "opentelemetry-api==1.45.1",
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-semantic-conventions==0.66b1",
  "opentelemetry-exporter-prometheus==0.66b1",
]
