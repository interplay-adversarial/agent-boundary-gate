[project]
name = "agent-boundary-gate-gym-native-effects"
version = "0.1.0"
requires-python = "==3.14.7"
dependencies = [
  # Separate third environment: the supervised native Gym worker imports both the pinned
  # SimpleAgent and Interplay's native target adapter. Do not merge it into onboarding/gym
  # (offline replay/OpenShell) or onboarding/red-team (DataDesigner campaigns).
  "interplay-adversarial @ git+https://github.com/interplay-adversarial/interplay.git@ba848bc3fc1dc7fff47861a798c87deb338c37e0",
  "nemo-gym @ git+https://github.com/NVIDIA-NeMo/Gym.git@b454c9a6e9a5644564fac81064050094b237daaa",
  "pyarrow==24.0.0",
]

[tool.uv]
package = false
# Same explicit CVE remediations as onboarding/gym; a development baseline, not upstream's lock.
constraint-dependencies = [
  "datasets==5.0.1",
  "filelock==4.2.4",
  "fsspec==2026.6.0",
  "hydra-core==1.3.7",
  "idna==3.15",
  "python-dotenv==1.2.2",
  "requests==2.33.0",
  "virtualenv==21.7.13",
]
