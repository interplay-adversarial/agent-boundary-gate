[project]
name = "agent-boundary-gate-designer-campaigns"
version = "0.1.0"
requires-python = "==3.14.7"
dependencies = [
  "interplay-adversarial[assessment] @ git+https://github.com/interplay-adversarial/interplay.git@ba848bc3fc1dc7fff47861a798c87deb338c37e0",
  "data-designer==0.9.7",
  "pyarrow==24.0.0",
  "pydantic==2.14.0",
  "any-llm-sdk==1.37.0",
  "openai==3.33.0",
]

[tool.uv]
package = false
# data-designer==0.9.7 itself hard-pins opentelemetry-api<1.44,>=1.43 (CVE-2026-114603,
# fixed in 1.45.1, is not resolvable within that range). Overrides the whole matched
# OpenTelemetry release train past it; data-designer only uses the stable, additive
# metrics/trace API surface, verified empirically by the full test suite below.
override-dependencies = [
  "opentelemetry-api==1.45.1",
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-semantic-conventions==0.66b1",
  "opentelemetry-exporter-prometheus==0.66b1",
]
